# Builds both images natively on an ARM CodeBuild host and pushes them with an immutable tag
# (IMAGE_TAG = hash of the staged source asset, set by the stack). Inputs pinned by the stack:
# NUCLEUS_VERSION / NUCLEUS_SHA256 (Greengrass nucleus zip) and GG_DOCKER_COMMIT (official
# aws-greengrass-docker repository commit).
version: 0.2
env:
  shell: bash
phases:
  pre_build:
    commands:
      - set -euo pipefail
      - echo "arch=$(uname -m)"
      - REGISTRY="${SIM_REPO%%/*}"
      - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
  build:
    commands:
      - set -euo pipefail
      - |
        if aws ecr describe-images --repository-name "${SIM_REPO#*/}" --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then
          echo "simulator:$IMAGE_TAG exists"
        else
          docker build --platform linux/arm64 -f containers/simulator/Dockerfile -t "$SIM_REPO:$IMAGE_TAG" .
          docker push "$SIM_REPO:$IMAGE_TAG"
        fi
      - |
        if aws ecr describe-images --repository-name "${GG_REPO#*/}" --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then
          echo "greengrass:$IMAGE_TAG exists"
        else
          git clone --quiet https://github.com/aws-greengrass/aws-greengrass-docker.git /tmp/ggd
          git -C /tmp/ggd checkout --quiet "$GG_DOCKER_COMMIT"
          curl -sSfL -o "/tmp/ggd/greengrass-${NUCLEUS_VERSION}.zip" "https://d2s8p88vqu9w66.cloudfront.net/releases/greengrass-${NUCLEUS_VERSION}.zip"
          echo "${NUCLEUS_SHA256}  /tmp/ggd/greengrass-${NUCLEUS_VERSION}.zip" | sha256sum -c -
          # Same Dockerfile, two local changes: base image from ECR Public (same official Amazon Linux
          # image, no Docker Hub limits) and the verified nucleus zip copied in instead of downloaded.
          sed -i 's#^FROM amazonlinux:2023#FROM public.ecr.aws/amazonlinux/amazonlinux:2023#' /tmp/ggd/Dockerfile
          sed -i "s#wget \$GREENGRASS_RELEASE_URI \&\& ##" /tmp/ggd/Dockerfile
          sed -i "s#^COPY \"greengrass-entrypoint.sh\" /#COPY \"greengrass-entrypoint.sh\" /\nCOPY greengrass-${NUCLEUS_VERSION}.zip /#" /tmp/ggd/Dockerfile
          grep -n "FROM\|COPY\|wget" /tmp/ggd/Dockerfile
          docker build --platform linux/arm64 --build-arg GREENGRASS_RELEASE_VERSION="$NUCLEUS_VERSION" -t greengrass-base:local /tmp/ggd
          docker build --platform linux/arm64 --build-arg BASE_IMAGE=greengrass-base:local \
            --build-arg NUCLEUS_VERSION="$NUCLEUS_VERSION" -f containers/greengrass/Dockerfile -t "$GG_REPO:$IMAGE_TAG" .
          docker push "$GG_REPO:$IMAGE_TAG"
        fi
